name: Lint (Go)

# Dedicated golangci-lint workflow, mirroring hmdocwize/portal's golangci-lint.yml.
# Runs on GitHub-hosted runners. Lint rules live in .golangci.yaml at the repo root.
# This replaces the `lint` job that previously lived in ci.yaml (removed there so
# golangci-lint does not run twice per push/PR).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
