name: Lint (Go)

# Dedicated golangci-lint workflow, mirroring hmdocwize/portal's golangci-lint.yml.
# Runs on GitHub-hosted runners. Lint rules live in .golangci.yaml at the repo root.
# This replaces the `lint` job that previously lived in ci.yaml (removed there so
# golangci-lint does not run twice per push/PR).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# One run per PR: a new push cancels that PR's previous run. Every other event gets a group of its own
# (run_id), so a push or a scheduled run is never cancelled or skipped: a shared group would drop runs,
# because GitHub cancels a pending run when a newer one queues (hmdocwize/portal#1741).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
